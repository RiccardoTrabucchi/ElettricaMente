<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Nostri Lavori | ElettricaMente</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo-container"><img src="assets/img/logo.png" alt="Logo" class="logo"></div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="progetti.html" style="color: var(--teal-aqua);">I Nostri Lavori</a></li>
                <li><a href="contatti.html">Contatti</a></li>
            </ul>
        </nav>
    </header>

    <section class="services" style="padding-top: 50px;">
        <h2 class="section-title">Archivio Lavori</h2>
        <p style="text-align:center; color:var(--text-muted); margin-bottom: 3rem;">
            Una selezione dei nostri interventi su impianti, quadri e automazioni.
        </p>
        
        <!-- Qui Javascript inserirà le card dei progetti -->
        <div id="progetti-grid" class="grid-3"></div>
    </section>

    <!-- MODAL (Finestra a comparsa per la Galleria) -->
    <div id="modal-galleria" class="modal">
        <span class="close-modal"><i class="fa-solid fa-xmark"></i></span>
        <div class="modal-content">
            <div class="modal-img-container">
                <button class="nav-btn prev-btn"><i class="fa-solid fa-chevron-left"></i></button>
                <img id="img-corrente" src="" alt="Progetto">
                <button class="nav-btn next-btn"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="modal-info">
                <h3 id="modal-titolo">Titolo Progetto</h3>
                <p id="modal-descrizione">Descrizione dettagliata dell'intervento...</p>
            </div>
        </div>
    </div>

    <!-- Importiamo il nostro motore JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
