<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatti | ElettricaMente</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo-container"><img src="assets/img/logo.png" alt="Logo" class="logo"></div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="progetti.html">I Nostri Lavori</a></li>
                <li><a href="contatti.html" style="color: var(--teal-aqua);">Contatti</a></li>
            </ul>
        </nav>
    </header>

    <section class="services" style="padding-top: 50px;">
        <h2 class="section-title">Mettiamoci in Contatto</h2>
        
        <div class="contact-layout">
            <!-- Dati Aziendali -->
            <div class="contact-info">
                <div class="contact-item">
                    <i class="fa-solid fa-envelope"></i>
                    <div>
                        <h4>Email</h4>
                        <p><a href="mailto:info@elettricamente.it">info@elettricamente.it</a></p>
                    </div>
                </div>
                <div class="contact-item">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <h4>Telefono / Assistenza</h4>
                        <p><a href="tel:+390000000000">+39 000 000 0000</a></p>
                    </div>
                </div>
                <div class="contact-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <div>
                        <h4>Sede Operativa</h4>
                        <p>Via dell'Industria 123, Città (Provincia)</p>
                    </div>
                </div>
                <div class="contact-item">
                    <i class="fa-solid fa-building"></i>
                    <div>
                        <h4>Dati Societari</h4>
                        <p>ELETTRICAMENTE S.R.L.<br>P.IVA / C.F.: 01234567890</p>
                    </div>
                </div>
            </div>

            <!-- Mappa di Google -->
            <div class="contact-map">
                <!-- Vai su Google Maps, cerca il tuo indirizzo, fai Condividi -> Incorpora Mappa e incolla qui l'iframe -->
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2798.123!2d9.18!3d45.46!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDXCsDI3JzM2LjAiTiA5wrAxMCc0OC4wIkU!5e0!3m2!1sit!2sit!4v1600000000000!5m2!1sit!2sit" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </section>

</body>
</html>
